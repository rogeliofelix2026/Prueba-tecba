services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_inteligente}
      POSTGRES_USER: ${POSTGRES_USER:-gi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gi_password}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gi_user} -d ${POSTGRES_DB:-gestion_inteligente}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: